name: Offline checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENAI_API_KEY: ""

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements-dev.txt
          .venv/bin/pip install --no-deps -e backend
      - name: Backend tests
        run: .venv/bin/python -m pytest backend/tests
      - name: Backend lint and types
        run: |
          .venv/bin/ruff check backend
          .venv/bin/mypy --config-file backend/pyproject.toml backend/app

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements-dev.txt
          .venv/bin/pip install --no-deps -e backend
          npm --prefix frontend ci
      - name: Frontend lint, contract and types
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run contract:check
          npm --prefix frontend run typecheck
      - name: Frontend unit tests and production build
        run: |
          npm --prefix frontend test -- --run --maxWorkers=1
          npm --prefix frontend run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chrome
      - name: Browser workflow tests
        run: npm --prefix frontend run e2e
