[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-cv-api"
version = "0.1.0"
description = "Evidence-grounded AI CV Builder API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "openai==3.8.0",
  "pydantic==2.13.5",
  "python-dotenv==1.2.1",
  "uvicorn[standard]==0.52.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.15.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]
