<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title description">
  <title id="title">Evidence CV user-to-PDF architecture</title>
  <desc id="description">A data-flow diagram showing the React frontend, FastAPI backend services, in-memory session store, supplied job data, OpenAI provider boundary and gated local PDF export.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 16px; font-weight: 400; fill: #475569; }
      .cluster-title { font-size: 17px; font-weight: 700; fill: #334155; }
      .box-title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .box-copy { font-size: 13px; font-weight: 400; fill: #475569; }
      .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">Evidence CV - user-to-PDF data flow</text>
  <text x="800" y="76" text-anchor="middle" class="subtitle">Confirmed profile facts remain separate from job evidence at every stage</text>

  <rect x="610" y="105" width="380" height="86" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="800" y="136" text-anchor="middle" class="box-title">User</text>
  <text x="800" y="159" text-anchor="middle" class="box-copy">introduces, reviews, confirms, selects and edits</text>
  <text x="800" y="179" text-anchor="middle" class="box-copy">Only the user can confirm profile facts</text>

  <rect x="70" y="225" width="1460" height="180" rx="18" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2"/>
  <text x="98" y="255" class="cluster-title">React + TypeScript frontend</text>
  <rect x="120" y="278" width="880" height="92" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="560" y="309" text-anchor="middle" class="box-title">Guided workflow</text>
  <text x="560" y="334" text-anchor="middle" class="box-copy">Profile -&gt; Job matches -&gt; CV studio -&gt; Evidence</text>
  <text x="560" y="356" text-anchor="middle" class="box-copy">Shows permitted actions, excerpts, matched skills, gaps and claim-to-fact links</text>
  <rect x="1080" y="278" width="400" height="92" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="1280" y="309" text-anchor="middle" class="box-title">Local PDF renderer</text>
  <text x="1280" y="334" text-anchor="middle" class="box-copy">@react-pdf/renderer</text>
  <text x="1280" y="356" text-anchor="middle" class="box-copy">Unlocked only for the validated draft hash</text>

  <rect x="70" y="455" width="1460" height="340" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="98" y="485" class="cluster-title">FastAPI backend - only process that reads OPENAI_API_KEY</text>
  <rect x="120" y="512" width="1360" height="72" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="800" y="541" text-anchor="middle" class="box-title">Typed /api/sessions interface</text>
  <text x="800" y="564" text-anchor="middle" class="box-copy">Consistent validation, state-conflict, not-found and provider-error responses</text>

  <rect x="120" y="625" width="300" height="124" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="270" y="655" text-anchor="middle" class="box-title">SessionWorkflow</text>
  <text x="270" y="681" text-anchor="middle" class="box-copy">UUID session isolation</text>
  <text x="270" y="703" text-anchor="middle" class="box-copy">explicit confirmation</text>
  <text x="270" y="725" text-anchor="middle" class="box-copy">downstream invalidation</text>

  <rect x="470" y="625" width="300" height="124" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="620" y="655" text-anchor="middle" class="box-title">AgentService</text>
  <text x="620" y="681" text-anchor="middle" class="box-copy">maximum 6 serial tool steps</text>
  <text x="620" y="703" text-anchor="middle" class="box-copy">update_profile | retrieve_jobs</text>
  <text x="620" y="725" text-anchor="middle" class="box-copy">generate_cv | Observations</text>

  <rect x="820" y="625" width="300" height="124" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="970" y="655" text-anchor="middle" class="box-title">RetrievalService</text>
  <text x="970" y="681" text-anchor="middle" class="box-copy">9 cached job embeddings</text>
  <text x="970" y="703" text-anchor="middle" class="box-copy">cosine top 3 + ID tie-break</text>
  <text x="970" y="725" text-anchor="middle" class="box-copy">exact excerpt + evidence gaps</text>

  <rect x="1170" y="625" width="300" height="124" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1320" y="655" text-anchor="middle" class="box-title">CVService</text>
  <text x="1320" y="681" text-anchor="middle" class="box-copy">structured CV claims</text>
  <text x="1320" y="703" text-anchor="middle" class="box-copy">fact-reference validation</text>
  <text x="1320" y="725" text-anchor="middle" class="box-copy">validated content hash</text>

  <rect x="90" y="860" width="420" height="115" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="300" y="893" text-anchor="middle" class="box-title">Temporary in-memory sessions</text>
  <text x="300" y="919" text-anchor="middle" class="box-copy">confirmed facts, selected job, CV and trace</text>
  <text x="300" y="942" text-anchor="middle" class="box-copy">cleared when the backend restarts</text>

  <rect x="565" y="860" width="330" height="115" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="730" y="893" text-anchor="middle" class="box-title">Supplied job evidence</text>
  <text x="730" y="919" text-anchor="middle" class="box-copy">data/jobs.jsonl</text>
  <text x="730" y="942" text-anchor="middle" class="box-copy">exactly 9 unique document_id values</text>

  <rect x="950" y="830" width="580" height="165" rx="18" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="980" y="860" class="cluster-title">OpenAI provider boundary</text>
  <rect x="985" y="882" width="250" height="82" rx="11" fill="#ffffff" stroke="#a78bfa"/>
  <text x="1110" y="910" text-anchor="middle" class="box-title">Responses API</text>
  <text x="1110" y="934" text-anchor="middle" class="box-copy">gpt-5.6-luna</text>
  <text x="1110" y="954" text-anchor="middle" class="box-copy">store=False + strict schemas</text>
  <rect x="1250" y="882" width="245" height="82" rx="11" fill="#ffffff" stroke="#a78bfa"/>
  <text x="1372" y="910" text-anchor="middle" class="box-title">Embeddings API</text>
  <text x="1372" y="936" text-anchor="middle" class="box-copy">text-embedding-3-small</text>

  <path d="M 800 191 L 800 278" class="edge"/>
  <text x="814" y="219" class="edge-label">natural language + explicit decisions</text>
  <path d="M 560 370 L 560 512" class="edge"/>
  <text x="575" y="438" class="edge-label">JSON over localhost</text>
  <path d="M 800 584 L 800 605 L 270 605 L 270 625" class="edge"/>
  <path d="M 800 584 L 800 605 L 620 605 L 620 625" class="edge"/>
  <path d="M 800 584 L 800 605 L 970 605 L 970 625" class="edge"/>
  <path d="M 800 584 L 800 605 L 1320 605 L 1320 625" class="edge"/>
  <path d="M 270 749 L 270 860" class="edge"/>
  <text x="282" y="816" class="edge-label">read / write</text>
  <path d="M 970 749 L 970 805 L 730 805 L 730 860" class="edge"/>
  <text x="748" y="823" class="edge-label">load + validate</text>
  <path d="M 620 749 L 620 790 L 1110 790 L 1110 882" class="edge-dashed"/>
  <text x="807" y="783" class="edge-label">next Action</text>
  <path d="M 1320 749 L 1320 790 L 1110 790 L 1110 882" class="edge-dashed"/>
  <path d="M 970 749 L 970 810 L 1372 810 L 1372 882" class="edge-dashed"/>
  <path d="M 1000 324 L 1080 324" class="edge"/>
  <text x="1040" y="310" text-anchor="middle" class="edge-label">validated hash</text>
  <path d="M 1280 278 L 1280 215 L 1000 215 L 1000 148 L 990 148" class="edge"/>
  <text x="1150" y="205" class="edge-label">local PDF</text>
</svg>
